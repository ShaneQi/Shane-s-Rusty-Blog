name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  BUILD_IMAGE: ghcr.io/shaneqi/rusty_blog:latest
  INPUT_DIR: .
  OUTPUT_DIR: dist
  CLOUDFLARE_PAGES_PROJECT_NAME: rusty-blog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: read
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static site with Docker
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          docker run --rm \
            -v "${PWD}/${INPUT_DIR}:/content:ro" \
            -v "${PWD}/${OUTPUT_DIR}:/output" \
            "${BUILD_IMAGE}"

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.OUTPUT_DIR }} --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

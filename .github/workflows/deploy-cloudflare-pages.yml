name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  # TODO: replace with your static-site builder image
  BUILD_IMAGE: your-registry/your-builder-image:tag
  # Host paths mounted into the container
  INPUT_DIR: .
  OUTPUT_DIR: dist
  # Paths inside the container passed as CLI args to the builder
  CONTAINER_INPUT: /input
  CONTAINER_OUTPUT: /output
  CLOUDFLARE_PAGES_PROJECT_NAME: your-cloudflare-pages-project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site with Docker
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          docker run --rm \
            -v "${PWD}/${INPUT_DIR}:${CONTAINER_INPUT}:ro" \
            -v "${PWD}/${OUTPUT_DIR}:${CONTAINER_OUTPUT}" \
            "${BUILD_IMAGE}" \
            --input "${CONTAINER_INPUT}" \
            --output "${CONTAINER_OUTPUT}"

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.OUTPUT_DIR }} --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
